<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1972F8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1C4D98" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="data:,">
  <title>Aeris DevBox</title>
  <style>
    body { margin: 0; min-height: 100svh; display: grid; place-items: center; background: Canvas; color: CanvasText; }
    #viewport { width: min(var(--screen-width-px, 336px), 100vw, calc(100svh * var(--screen-width, 336) / var(--crop-height, 480))); aspect-ratio: var(--screen-width, 336) / var(--crop-height, 480); overflow: hidden; }
    #viewport[hidden] { display: none; }
    canvas { display: block; width: 100%; height: auto; touch-action: none; }
    html.embedded, html.embedded body { overflow: hidden; overscroll-behavior: none; }
    html.embedded body { display: block; min-height: 0; background: transparent; color: #fff; }
    html.embedded #viewport { width: 100%; }
    p { font: menu; }
  </style>
</head>
<body>
  <div id="viewport">
    <canvas id="gallery" width="336" height="480" aria-label="Aeris UI 组件预览"></canvas>
  </div>
  <p id="error" role="alert" hidden>无法加载组件预览。</p>
  <!-- AERIS_RELOAD_SCRIPT -->
  <script>
    if (window.parent !== window) {
      document.documentElement.classList.add("embedded");
    }
    const viewport = document.getElementById("viewport");
    const canvas = document.getElementById("gallery");
    const params = new URLSearchParams(location.search);
    const configuration = JSON.parse(document.getElementById("aeris-displays")?.textContent || "null");
    const device = configuration?.devices.find(({ id }) => id === params.get("device")) ?? configuration?.devices[0]
      ?? { id: "xiaomi-band-10-pro-3.101.043", width: 336, height: 480, shape: "rectangle" };
    canvas.width = device.width;
    canvas.height = device.height;
    viewport.style.setProperty("--screen-width", device.width);
    viewport.style.setProperty("--screen-width-px", device.width + "px");
    viewport.style.setProperty("--crop-height", device.height);
    const radius = device.shape === "rectangle" ? 0 : Math.min(device.width, device.height) / 2;
    const outline = new Path2D();
    outline.roundRect(0, 0, device.width, device.height, radius);
    if (radius) canvas.style.clipPath = `inset(0 round ${radius / device.width * 100}% / ${radius / device.height * 100}%)`;
    const context = canvas.getContext("2d", { alpha: false });
    let cropHeight = canvas.height;
    let frame;
    let pointer = null;
    let lastPaint;
    let frameTime = 0;
    let memoryBytes = 0;
    let submissions = 0;
    let renderStart;
    let lastRender = null;
    const performanceListeners = new Set();
    let reload;
    let runtimeFailed = false;
    const debug = params.has("debug") && window.parent !== window;
    const reloadable = debug && params.has("reloadable") && typeof createPreviewReload === "function";
    const storage = "aeris:app:" + (document.querySelector('meta[name="aeris-storage"]')?.content || "")
      + ":" + (configuration?.isolatedStorage ? device.id + ":" : "");
    function notify(type, data = {}) {
      if (debug) window.parent.postMessage({ type, ...data }, location.origin);
    }
    const point = (event) => {
      const bounds = canvas.getBoundingClientRect();
      return [
        Math.min(canvas.width - 1, Math.max(0, Math.floor((event.clientX - bounds.left) * canvas.width / bounds.width))),
        Math.min(cropHeight - 1, Math.max(0, Math.floor((event.clientY - bounds.top) * canvas.height / bounds.height))),
      ];
    };
    function contains(x, y) {
      return context.isPointInPath(outline, x + 0.5, y + 0.5);
    }
    async function loadChineseFonts() {
      const controller = new AbortController();
      let timeout;
      const deadline = new Promise((resolve) => { timeout = setTimeout(resolve, 4000); });
      const faces = [[400, "regular"], [500, "medium"], [650, "demibold"]];
      const loading = Promise.allSettled(faces.map(async ([weight, name]) => {
        const url = "https://cdn.cnbj1.fds.api.mi-img.com/watchface-editor-release/fonts/misans-" + name + ".otf";
        const response = await fetch(url, { signal: controller.signal });
        if (!response.ok) return;
        const face = new FontFace("Aeris MiSans " + weight, await response.arrayBuffer(), { weight: String(weight) });
        await face.load();
        if (!controller.signal.aborted) document.fonts.add(face);
      }));
      await Promise.race([loading, deadline]);
      clearTimeout(timeout);
      // Keep layout and cached glyphs stable for the lifetime of this preview.
      controller.abort();
    }
    const chineseFontsReady = loadChineseFonts();
    var Module = {
      noInitialRun: true,
      galleryDevice: device,
      galleryDebugEnabled: debug,
      galleryReloadEnabled: reloadable,
      galleryStorageAccess: {
        getItem: (key) => localStorage.getItem(storage + key),
        setItem: (key, value) => localStorage.setItem(storage + key, value),
        removeItem: (key) => localStorage.removeItem(storage + key),
      },
      galleryCrop(height) {
        if (!Number.isInteger(height) || height < 1 || height > canvas.height) return;
        cropHeight = height;
        viewport.style.setProperty("--crop-height", String(height));
        viewport.dataset.cropHeight = String(height);
        if (window.parent !== window && location.origin !== "null") {
          window.parent.postMessage({ type: "aeris-preview-size", height }, location.origin);
        }
      },
      galleryPaint(memory, start, width, height) {
        if (width !== canvas.width || height !== canvas.height) return;
        frame ??= context.createImageData(width, height);
        for (let i = 0; i < frame.data.length; i += 4) {
          frame.data[i] = memory[start + i + 2];
          frame.data[i + 1] = memory[start + i + 1];
          frame.data[i + 2] = memory[start + i];
          frame.data[i + 3] = 255;
        }
        context.putImageData(frame, 0, 0);
        if (debug) {
          const now = performance.now();
          if (lastPaint !== undefined) frameTime = now - lastPaint;
          lastPaint = now;
          memoryBytes = memory.byteLength;
          submissions++;
        }
        if (!canvas.dataset.ready) canvas.dataset.ready = "true";
      },
      galleryRenderStart() {
        renderStart = { time: performance.now(), submissions };
      },
      galleryRenderReady() {
        if (!renderStart || runtimeFailed) return;
        const now = performance.now();
        const count = submissions - renderStart.submissions;
        const durationMs = now - renderStart.time;
        renderStart = undefined;
        if (!count) return;
        lastRender = { at: performance.timeOrigin + now, durationMs, submissions: count };
        for (const listener of performanceListeners) listener(lastRender);
      },
      galleryLog(level, text) {
        notify("aeris-debug-log", { level, text: String(text) });
      },
      print(text) { console.log(text); Module.galleryLog("log", text); },
      printErr(text) { console.error(text); Module.galleryLog("error", text); },
      galleryError() {
        if (runtimeFailed) return;
        runtimeFailed = true;
        for (const listener of performanceListeners) listener(null);
        performanceListeners.clear();
        notify("aeris-debug-error");
        viewport.hidden = true;
        document.getElementById("error").hidden = false;
      },
      onRuntimeInitialized() {
        const input = {
          pointer: (...args) => Module._gallery_pointer(...args),
          wheel: (...args) => Module._gallery_wheel(...args),
          back: () => Module._devbox_back(),
        };
        const boot = () => {
          void chineseFontsReady.then(() => {
            try { Module.callMain(); }
            catch (error) {
              if (error !== "unwind" && !runtimeFailed) {
                Module.galleryLog("error", error);
                Module.galleryError();
              }
            }
          });
        };
        const ready = () => !!canvas.dataset.ready && !runtimeFailed;
        if (reloadable) {
          reload = createPreviewReload({
            stage: params.has("staged"), storage, contains, boot, ready, input,
            inspect() {
              Module.galleryNodes = [];
              Module._gallery_reload_inspect();
              return Module.galleryNodes;
            },
            hit: (...args) => Module._gallery_reload_hit(...args),
            scrolling: () => Module._gallery_reload_scrolling(),
            scrollTo: (...args) => Module._gallery_reload_scroll(...args),
            failed: () => runtimeFailed,
          });
          window.aerisReload = reload.api;
          Module.galleryStorageAccess = reload.storageAccess;
        }
        const controls = reload ?? input;
        let wheel = { time: -Infinity, x: 0, y: 0 };
        window.addEventListener("keydown", (event) => {
          if (event.key === "Escape" && !event.defaultPrevented && ready()) controls.back();
        });
        if (debug) {
          window.aerisDebugger = {
            snapshot(options) {
              if (!ready()) return null;
              const geometry = !!options?.layers;
              Module.galleryNodes = [];
              Module._gallery_inspect(geometry);
              const nodes = Module.galleryNodes;
              let layerNodes;
              if (geometry) {
                Module.galleryNodes = [];
                Module._gallery_inspect_overlay(true);
                Module.galleryNodes = Module.galleryNodes.concat(nodes);
                Module._gallery_inspect_overlay(false);
                layerNodes = Module.galleryNodes;
              }
              return {
                nodes,
                ...(layerNodes && { layerNodes }),
                width: canvas.width,
                height: cropHeight,
                frameTime,
                memoryBytes,
              };
            },
            performance: {
              read() {
                return ready() && lastRender
                  ? { lastRender, submissions, memoryBytes: Module.galleryWasmCapacity() }
                  : null;
              },
              subscribe(listener) {
                if (runtimeFailed) listener(null);
                else performanceListeners.add(listener);
                return () => performanceListeners.delete(listener);
              },
            },
            screenshot() {
              if (!canvas.dataset.ready) return null;
              const output = document.createElement("canvas");
              output.width = canvas.width;
              output.height = cropHeight;
              const capture = output.getContext("2d");
              capture.clip(outline);
              capture.drawImage(canvas, 0, 0);
              return output.toDataURL("image/png");
            },
            contains,
          };
        }
        canvas.addEventListener("wheel", (event) => {
          if (event.defaultPrevented || event.ctrlKey || event.metaKey) return;
          event.preventDefault();
          if (pointer !== null || !canvas.dataset.ready) return;
          const mode = event.deltaMode;
          const bounds = canvas.getBoundingClientRect();
          const units = mode === WheelEvent.DOM_DELTA_LINE ? 16
            : mode === WheelEvent.DOM_DELTA_PAGE ? cropHeight : canvas.height / bounds.height;
          if (event.timeStamp - wheel.time > 200) wheel = { time: event.timeStamp, x: 0, y: 0 };
          wheel.time = event.timeStamp;
          wheel.x += Math.max(-canvas.width, Math.min(canvas.width, event.deltaX * units));
          wheel.y += Math.max(-cropHeight, Math.min(cropHeight, event.deltaY * units));
          const dx = Math.trunc(wheel.x);
          const dy = Math.trunc(wheel.y);
          wheel.x -= dx;
          wheel.y -= dy;
          const position = point(event);
          if ((dx || dy) && contains(...position)) controls.wheel(...position, dx, dy);
        }, { passive: false });
        canvas.addEventListener("pointerdown", (event) => {
          if (pointer !== null || event.button !== 0 || !canvas.dataset.ready) return;
          const position = point(event);
          if (!contains(...position)) return;
          pointer = event.pointerId;
          canvas.setPointerCapture(pointer);
          controls.pointer(...position, 0);
        });
        canvas.addEventListener("pointermove", (event) => {
          if (pointer === event.pointerId) controls.pointer(...point(event), 1);
        });
        for (const [name, phase] of [["pointerup", 2], ["pointercancel", 3], ["lostpointercapture", 3]]) {
          canvas.addEventListener(name, (event) => {
            if (pointer !== event.pointerId) return;
            pointer = null;
            const position = point(event);
            controls.pointer(...position, contains(...position) ? phase : 3);
          });
        }
        if (reload) reload.start();
        else boot();
      },
      onAbort(reason) { Module.galleryLog("error", reason); Module.galleryError(); },
    };
  </script>
  {{{ SCRIPT }}}
</body>
</html>
